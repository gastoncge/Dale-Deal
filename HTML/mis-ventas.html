<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis ventas - DALE DEAL</title>

    <!-- Página privada del vendedor — no debe aparecer en buscadores. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="shortcut icon" href="../IMG/LOGO.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="../IMG/LOGO.png" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#d63031" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../CSS/variables.css" />
    <link rel="stylesheet" href="../CSS/components.css" />
    <link rel="stylesheet" href="../CSS/responsive.css" />

    <style>
      body {
        background: var(--gray-50, #f8f9fa);
        min-height: 100vh;
        font-family: var(--font-family, 'Inter', sans-serif);
      }
      .ventas-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .ventas-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      .ventas-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0;
      }
      .order-card {
        background: var(--white);
        color: var(--gray-800);
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
        padding: 1.25rem;
        margin-bottom: 1rem;
        border: 1px solid var(--gray-200);
      }
      .order-row {
        display: flex;
        gap: 1rem;
        align-items: flex-start;
      }
      .order-img {
        width: 80px; height: 80px; border-radius: 8px; object-fit: cover;
        flex-shrink: 0; background: var(--gray-100);
      }
      .order-meta {
        flex: 1;
        min-width: 0;
      }
      .order-id {
        font-size: .8rem; color: var(--gray-500, #6b7280);
        margin-bottom: .25rem;
      }
      .order-title {
        font-weight: 600;
        margin: 0 0 .25rem;
      }
      .order-buyer {
        font-size: .85rem;
        color: var(--gray-700, #374151);
      }
      .badge-status {
        font-size: .75rem;
        padding: .25rem .6rem;
        border-radius: 999px;
        font-weight: 600;
        white-space: nowrap;
      }
      .status-pending     { background: #fef3c7; color: #92400e; }
      .status-confirmed   { background: #dbeafe; color: #1e40af; }
      .status-shipped     { background: #e0e7ff; color: #3730a3; }
      .status-delivered   { background: #d1fae5; color: #065f46; }
      .status-cancelled   { background: #fee2e2; color: #991b1b; }

      /* Status badges en dark mode: fondos translúcidos + texto claro */
      [data-theme="dark"] .status-pending   { background: rgba(245,158,11,.18); color: #fbbf24; }
      [data-theme="dark"] .status-confirmed { background: rgba(59,130,246,.18); color: #60a5fa; }
      [data-theme="dark"] .status-shipped   { background: rgba(99,102,241,.18); color: #818cf8; }
      [data-theme="dark"] .status-delivered { background: rgba(16,185,129,.18); color: #34d399; }
      [data-theme="dark"] .status-cancelled { background: rgba(239,68,68,.18); color: #f87171; }

      .ship-block {
        background: var(--gray-50);
        color: var(--gray-700);
        border-radius: 8px;
        padding: .75rem;
        margin-top: .75rem;
        font-size: .85rem;
      }
      .ship-block strong { display: block; margin-bottom: .25rem; }
      .order-actions {
        display: flex;
        gap: .5rem;
        flex-wrap: wrap;
        margin-top: .75rem;
      }
      .empty-state {
        text-align: center;
        padding: 4rem 1rem;
        color: var(--gray-500, #6b7280);
      }
      .empty-state i { font-size: 3rem; opacity: .4; }

      /* ===== MOBILE TWEAKS ===== */
      @media (max-width: 575px) {
        .ventas-wrap { padding: 1rem .75rem; }
        .ventas-header {
          flex-direction: column;
          align-items: flex-start;
          gap: .75rem;
        }
        .ventas-header h1 { font-size: 1.25rem; }
        .ventas-header .btn { width: 100%; text-align: center; }
        .order-card { padding: 1rem; }
        .order-img { width: 64px; height: 64px; }
        .order-row { gap: .75rem; }
        .ship-block { font-size: .8rem; padding: .6rem; }
        .order-actions .btn { width: 100%; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div class="ventas-wrap">
      <!-- Breadcrumb-like back link: la página no usa la navbar global,
           así que sin este link el usuario queda atrapado. -->
      <a href="../index.html" class="text-muted text-decoration-none small d-inline-flex align-items-center gap-1 mb-3">
        <i class="bi bi-arrow-left"></i> Volver al inicio
      </a>

      <div class="ventas-header">
        <h1><i class="bi bi-bag-check me-2"></i>Mis ventas</h1>
        <a href="./publicar.html" class="btn btn-primary btn-sm">
          <i class="bi bi-plus-circle me-1"></i> Nueva publicación
        </a>
      </div>

      <div id="ventas-loading" class="empty-state">
        <div class="spinner-border" role="status"></div>
        <p class="mt-3">Cargando tus ventas…</p>
      </div>

      <div id="ventas-empty" class="empty-state" style="display:none;">
        <i class="bi bi-bag"></i>
        <p class="mt-3 mb-1 fw-semibold">Todavía no tenés ventas</p>
        <p class="small">Cuando alguien compre uno de tus productos, va a aparecer acá.</p>
      </div>

      <div id="ventas-error" class="empty-state" style="display:none;">
        <i class="bi bi-exclamation-triangle text-warning"></i>
        <p class="mt-3 mb-0">No pudimos cargar tus ventas.</p>
        <p id="ventas-error-msg" class="small"></p>
      </div>

      <div id="ventas-list"></div>
    </div>

    <!-- Modal: gestionar envío -->
    <div class="modal fade" id="trackingModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-truck me-2"></i>Gestionar envío</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-muted" id="tracking-order-info"></p>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Número de tracking</label>
              <input type="text" class="form-control" id="tracking-input" maxlength="80"
                     placeholder="Ej: AR123456789" />
              <div class="form-text small">Lo genera el courier (Correo, Andreani, OCA…) cuando despachás.</div>
            </div>

            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="tracking-mark-shipped" />
              <label class="form-check-label small" for="tracking-mark-shipped">
                Marcar como <strong>despachado</strong> (la orden pasa a "shipped" y se notifica al comprador)
              </label>
            </div>

            <div id="tracking-error" class="alert alert-danger d-none small mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="tracking-save-btn">
              <i class="bi bi-save me-1"></i> Guardar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/theme.js" defer></script>
    <script src="../JS/utils.js" defer></script>
    <script src="../JS/api.js" defer></script>
    <script src="../JS/pages/mis-ventas.js" defer></script>
  </body>
</html>
